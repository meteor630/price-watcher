<dialog class="dialog" data-modal data-open aria-labelledby="delete-title">
  <form class="dialog__body" data-close-on-success hx-post="/web/groups/{{ group.group_id }}/delete" hx-select="#page-rest" hx-target="#page-rest" hx-swap="outerHTML" hx-select-oob="#flash">
    <h2 id="delete-title" class="dialog__title">Удалить группу «{{ group.name }}»?</h2>
    <p class="dialog__text">В группе {{ count_word(group.item_count, "товар", "товара", "товаров") }}.</p>
    <input type="hidden" name="version" value="{{ group.version }}">
    <label class="radio"><input type="radio" name="items" value="keep" checked data-autofocus> Оставить товары в категории без группы</label>
    <label class="radio"><input type="radio" name="items" value="delete"> Удалить вместе с группой</label>
    <div class="dialog__actions">
      <button class="btn btn--ghost" type="button" data-dialog-close>Отмена</button>
      <button class="btn btn--danger" type="submit">Удалить</button>
    </div>
  </form>
</dialog>
