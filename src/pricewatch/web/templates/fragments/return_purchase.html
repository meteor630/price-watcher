<dialog class="dialog" data-modal data-open aria-labelledby="return-title">
  <form class="dialog__body" data-close-on-success hx-post="/web/items/{{ detail.item_id }}/return"
        hx-select="#hero-figures" hx-target="#hero-figures" hx-swap="outerHTML" hx-select-oob="#page-rest,#flash">
    <h2 id="return-title" class="dialog__title">Вернуть «{{ detail.name }}» в список?</h2>
    <p class="dialog__text">Покупка от {{ long_date(detail.purchase.purchased_on) }} на {{ detail.purchase.total_text }} будет удалена и не войдёт в статистику.</p>
    <input type="hidden" name="version" value="{{ detail.version }}">
    <div class="dialog__actions">
      <button class="btn btn--ghost" type="button" data-dialog-close data-autofocus>Отмена</button>
      <button class="btn btn--primary" type="submit">Вернуть в список</button>
    </div>
  </form>
</dialog>
