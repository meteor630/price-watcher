# Домашний узел: только приёмник копий. Сайт, база и планировщик — на арендном сервере (deploy/vps).
# Worker с Chrome — программой Windows (deploy/windows), ходит на сервер по HTTPS.
# Запуск из этой папки: docker compose up -d --build
# Настройки: ../../pull.env (адрес сервера, токен приёмника), .env рядом (BACKUP_HOST_DIR — папка копий на ПК).
# Оба файла в Git не попадают. Путь к pull.env можно задать переменной PRICEWATCH_PULL_ENV.
# Приёмник при старте (ПК мог быть выключен) и ежедневно забирает с сервера новые копии, сверяет sha256 и размер,
# хранит 30 суток. Входящих портов нет: соединения только исходящие. Ничего не распаковывает и не запускает.

name: pricewatch-home

services:
  backup-pull:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: app
    image: pricewatch-app
    command: ["python", "-m", "pricewatch.bootstrap", "pull-backups"]
    env_file: ${PRICEWATCH_PULL_ENV:-../../pull.env}
    environment:
      PRICEWATCH_PULL_DIR: /backups
    volumes:
      - ${BACKUP_HOST_DIR:?задайте BACKUP_HOST_DIR в deploy/home/.env}:/backups
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
