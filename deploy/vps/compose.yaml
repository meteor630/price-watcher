# Арендный сервер: пересылка в туннель (HAProxy) и Telegram-бот.
# Код: git clone git@github-price-watcher:meteor630/price-watcher.git /opt/price-watcher (ключ развёртывания только
# на чтение); обновление: git pull && docker compose up -d --build. Запуск из этой папки: docker compose up -d --build
# Настройки бота — bot.env рядом (образец ../../bot.env.example; в Git не попадает).
# HAProxy — в сети хоста: слушает 80 и 443 сервера и обращается к дому по адресу туннеля 10.66.0.2.

name: pricewatch-vps

services:
  haproxy:
    image: haproxy:3.2-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    network_mode: host
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    # Порты 80 и 443 образ занимает правом NET_BIND_SERVICE; других прав не нужно.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  bot:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: app
    image: pricewatch-bot
    command: ["python", "-m", "pricewatch.bot"]
    # Адрес сайта — публичный https://prices.meteor630.ru: бот заодно видит, открывается ли сайт снаружи.
    env_file: bot.env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
