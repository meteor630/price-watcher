# Арендный сервер (Aeza, prices.meteor630.ru): весь Price Watcher, кроме парсинга.
# Worker с Chrome — дома (deploy/windows), ходит сюда по HTTPS /worker/v1; сервер в дом не ходит никогда.
# Установка с нуля: deploy/vps/setup.sh. Обновление: cd /opt/price-watcher && git pull && sh deploy/vps/up.sh
# Секреты — вне Git, в /srv/secrets/pricewatch (права 600):
#   compose.env — POSTGRES_PASSWORD (подставляется в адрес базы);
#   server.env  — настройки сайта (PRICEWATCH_SECRET_KEY и др., образец ../../.env.example).
# Копии: планировщик (образ backup) раз в сутки — pg_dump + картинки → age, на сервере не больше двух (том backups);
# сайт отдаёт их домашнему приёмнику по /backups/v1 (том только на чтение). Сервер в дом не ходит.
# Сети: база видна только сайту и планировщику (backend); снаружи открыт только Caddy на 443 (edge).

name: pricewatch

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-server: &server
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
    target: app
  image: pricewatch-app
  env_file: /srv/secrets/pricewatch/server.env
  environment: &server-env
    PRICEWATCH_DATABASE_URL: "postgresql://pricewatch:${POSTGRES_PASSWORD:?нет POSTGRES_PASSWORD в /srv/secrets/pricewatch/compose.env}@db:5432/pricewatch"
    PRICEWATCH_MEDIA_DIR: /data/media
  logging: *logging
  restart: unless-stopped
  networks: [backend]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]

services:
  db:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: pricewatch
      POSTGRES_DB: pricewatch
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?нет POSTGRES_PASSWORD в /srv/secrets/pricewatch/compose.env}"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pricewatch", "-d", "pricewatch"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    logging: *logging
    restart: unless-stopped
    networks: [backend]

  migrate:
    <<: *server
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *server
    command: ["python", "-m", "pricewatch.bootstrap", "serve"]
    environment:
      <<: *server-env
      PRICEWATCH_LISTEN_HOST: 0.0.0.0
      PRICEWATCH_LISTEN_PORT: "8000"
      # X-Forwarded-For с IP посетителя — только от Caddy.
      PRICEWATCH_TRUSTED_PROXIES: 172.31.250.2/32
      PRICEWATCH_BACKUPS_DIR: /backups
    volumes:
      - media:/data/media
      - backups:/backups:ro
    networks:
      backend:
      edge:
        ipv4_address: 172.31.250.3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status != 200)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 768m

  scheduler:
    <<: *server
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: backup
    image: pricewatch-backup
    command: ["python", "-m", "pricewatch.bootstrap", "scheduler", "--backups"]
    environment:
      <<: *server-env
      PRICEWATCH_BACKUP_DIR: /backups
      # Открытый ключ age владельца: им копия шифруется; закрытого ключа на сервере нет.
      PRICEWATCH_BACKUP_RECIPIENT: age1lphlfa8e7neft64t630qgmzuzc3tzvtz9yqta26c9y8wkdj5nqcs2rl7lc
      PRICEWATCH_BACKUP_TIME: "04:30"
    # Картинки — только на чтение; незашифрованный дамп — в /tmp (память).
    volumes:
      - media:/data/media:ro
      - backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # Только 443: сертификат выпускается проверкой TLS-ALPN-01 на этом же порту, порт 80 не нужен.
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    networks:
      edge:
        ipv4_address: 172.31.250.2
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/29

volumes:
  pgdata:
  media:
  backups:
  caddy_data:
  caddy_config:
