# Арендный сервер: пересылка 80 и 443 в туннель к домашнему узлу без расшифровки (DEVELOPMENT_ARCHITECTURE.md, раздел 1).
# HTTPS расшифровывает Caddy дома; сюда не попадают ни сертификат, ни содержимое запросов. Настоящий IP посетителя —
# по PROXY protocol v2 (send-proxy-v2): без него дома не работают ограничения попыток входа по IP.
global
    log stdout format raw local0 info
    maxconn 2000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    # Долгие соединения (htmx, загрузка страниц) не рвутся раньше времени.
    timeout tunnel 1h
    # Дом проверяется раз в 5 с: после перезапуска он снова доступен через ~10 с (две удачные проверки).

frontend https
    bind :443
    default_backend home_https

frontend http
    bind :80
    default_backend home_http

backend home_https
    server home 10.66.0.2:443 send-proxy-v2 check inter 5s

backend home_http
    server home 10.66.0.2:80 send-proxy-v2 check inter 5s
