openapi: 3.1.0
info:
  title: Price Watcher API
  version: 1.0.0
  description: |
    JSON API для приложения iPhone и iPad. Контракт пишется до клиентов
    (DEVELOPMENT_ARCHITECTURE.md, раздел 9; IOS_APP_PLAN.md).

    Общие правила:
    - Имена полей — snake_case.
    - Деньги — целые копейки (`*_minor`, int64) и готовая строка для показа (`*_text`).
      Клиент деньги не считает и не форматирует.
    - Даты-время — UTC в ISO 8601. Календарные даты (`date`) — сутки по Москве.
    - Авторизация — только заголовок `Authorization: Bearer <access_token>`; cookie игнорируются.
    - Изменяющие запросы, кроме `/auth/*`, требуют заголовок `Idempotency-Key`.
      Тот же ключ с тем же телом возвращает сохранённый ответ; с другим телом — `409 IDEMPOTENCY_KEY_REUSED`.
    - Изменяемые записи несут `version`; устаревшая версия даёт `409 VERSION_CONFLICT` с актуальным состоянием.
    - Ответы чтения несут `ETag`; запрос с `If-None-Match` получает `304`, если данные не менялись.
    - Каждый ответ несёт `X-Request-ID` — идентификатор для журнала.
    - Строковые статусы открыты для расширения: клиент показывает нейтральное состояние
      для неизвестного значения, а не падает. Известные значения перечислены в `x-known-values`.
    - Новое необязательное поле не ломает клиента; удаление и переименование — только в `/api/v2`.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: example.invalid
        description: Домен задаётся конфигурацией сборки приложения.
security:
  - bearer: []
tags:
  - name: auth
  - name: dashboard
  - name: categories
  - name: items
  - name: runs
  - name: reviews
  - name: notifications
  - name: client_errors

paths:
  /auth/pair:
    post:
      tags: [auth]
      summary: Обменять pairing-код на пару токенов
      description: |
        Код — 8 символов, живёт 5 минут, одноразовый, сгорает после 5 неверных вводов.
        Создаёт устройство и семью refresh-токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, device_name]
              properties:
                code:
                  type: string
                  pattern: "^[A-Z2-7]{8}$"
                device_name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        "200":
          $ref: "#/components/responses/TokenPair"
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновить пару токенов
      description: |
        Ротация при каждом вызове. Повтор того же refresh-токена в течение 60 секунд
        возвращает ту же новую пару. Повтор позже отзывает всю семью: `401 REFRESH_TOKEN_REUSED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "200":
          $ref: "#/components/responses/TokenPair"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: Выйти и отозвать устройство
      responses:
        "204":
          description: Устройство отозвано, все его токены недействительны.
        "401":
          $ref: "#/components/responses/Error"

  /me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      responses:
        "200":
          description: Пользователь.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"

  /dashboard:
    get:
      tags: [dashboard]
      summary: Главная
      parameters:
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Итог, категории, сводные показатели, состояние проверки.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Error"

  /dashboard/items:
    get:
      tags: [dashboard]
      summary: Список товаров сводной панели
      description: Отслеживаемые, подешевевшие, подорожавшие или отсутствующие товары за период.
      parameters:
        - name: panel
          in: query
          required: true
          schema:
            type: string
            enum: [tracked, cheaper, pricier, out_of_stock]
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Страница списка, сортировка по величине изменения, затем по id.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ItemChange"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /categories/order:
    put:
      tags: [categories]
      summary: Переставить категории
      description: Полный упорядоченный список категорий пользователя и версия порядка из `/dashboard`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "200":
          description: Новый порядок.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderState"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Error"

  /categories/{category_id}:
    get:
      tags: [categories]
      summary: Страница категории
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/Period"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Итог категории и товары по группам.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /categories/{category_id}/chart:
    get:
      tags: [categories]
      summary: График суммы категории
      description: Сколько стоил бы нынешний состав категории в прошлые дни.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/ChartRange"
      responses:
        "200":
          $ref: "#/components/responses/Chart"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /groups/{group_id}/items/order:
    put:
      tags: [categories]
      summary: Переставить товары в группе
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "200":
          description: Новый порядок.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderState"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Error"

  /items/{item_id}:
    get:
      tags: [items]
      summary: Карточка товара
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Товар, цены по магазинам, история.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [items]
      summary: Изменить количество или отметку «в итоге»
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              minProperties: 2
              properties:
                version:
                  $ref: "#/components/schemas/Version"
                quantity:
                  $ref: "#/components/schemas/Quantity"
                in_total:
                  type: boolean
      responses:
        "200":
          description: Товар после изменения.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Error"

  /items/{item_id}/chart:
    get:
      tags: [items]
      summary: График цены товара в одном магазине
      description: Цена за одну штуку; количество на график не влияет.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: store_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/ChartRange"
      responses:
        "200":
          $ref: "#/components/responses/Chart"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /runs/current:
    get:
      tags: [runs]
      summary: Состояние последней проверки
      responses:
        "200":
          description: Последняя плановая или ручная проверка.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStatus"
        "401":
          $ref: "#/components/responses/Error"

  /runs:
    post:
      tags: [runs]
      summary: Запустить проверку вручную (администратор)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Проверка поставлена в очередь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStatus"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: "`RUN_IN_PROGRESS`: проверка уже идёт; в `details.run` её прогресс."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /runs/{run_id}/stop:
    post:
      tags: [runs]
      summary: Остановить проверку (администратор)
      description: Новые задания не выдаются, текущие дорабатывают.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Остановка принята.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStatus"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /reviews:
    get:
      tags: [reviews]
      summary: Подозрительные изменения, ждущие решения (администратор)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Страница списка, сначала старые.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /reviews/{review_id}/decision:
    post:
      tags: [reviews]
      summary: Принять или отклонить подозрительное изменение (администратор)
      description: Замена ссылки делается на сайте и в этот контракт пока не входит.
      parameters:
        - name: review_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accept, reject]
      responses:
        "200":
          description: Решение записано.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Conflict"

  /notifications:
    get:
      tags: [notifications]
      summary: Колокольчик — системные уведомления (администратор)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Страница уведомлений, сначала новые.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, unread_count]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
                  unread_count:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /notifications/read:
    post:
      tags: [notifications]
      summary: Отметить уведомления прочитанными (администратор)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [ids]
                  properties:
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 100
                      uniqueItems: true
                      items:
                        $ref: "#/components/schemas/Id"
                - type: object
                  additionalProperties: false
                  required: [all]
                  properties:
                    all:
                      const: true
      responses:
        "200":
          description: Остаток непрочитанных.
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /client_errors:
    post:
      tags: [client_errors]
      summary: Отчёт о неожиданной ошибке приложения
      description: |
        Лимит — 20 отчётов в час на устройство; сверх лимита `429`, приложение отчёт не повторяет.
        Сбой отправки не показывается пользователю.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app_version, os_version, screen, error_code, message, occurred_at]
              properties:
                app_version:
                  type: string
                  maxLength: 40
                os_version:
                  type: string
                  maxLength: 40
                screen:
                  type: string
                  maxLength: 80
                error_code:
                  type: string
                  maxLength: 80
                message:
                  type: string
                  maxLength: 2000
                occurred_at:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Отчёт принят.
          content:
            application/json:
              schema:
                type: object
                required: [error_id]
                properties:
                  error_id:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Access-токен живёт 15 минут.

  headers:
    ETag:
      description: Версия представления для `If-None-Match`.
      schema:
        type: string

  parameters:
    Period:
      name: period
      in: query
      required: false
      description: Период изменения; сутки начинаются в 00:00 по Москве.
      schema:
        $ref: "#/components/schemas/Period"
    ChartRange:
      name: range
      in: query
      required: false
      schema:
        type: string
        enum: [week, month, year]
        default: month
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникален для пользователя 24 часа.
      schema:
        type: string
        minLength: 8
        maxLength: 64
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"

  responses:
    TokenPair:
      description: Пара токенов. Refresh хранится в Keychain, access — в памяти.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenPair"
    Chart:
      description: Точки графика по возрастанию даты.
      content:
        application/json:
          schema:
            type: object
            required: [range, points]
            properties:
              range:
                type: string
              points:
                type: array
                items:
                  $ref: "#/components/schemas/ChartPoint"
    NotModified:
      description: Данные не менялись с указанного `ETag`.
    Error:
      description: Ошибка с кодом и понятным сообщением.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: |
        `VERSION_CONFLICT`: запись изменена в другом месте, в `details.current` актуальное состояние.
        `IDEMPOTENCY_KEY_REUSED`: ключ уже использован с другим телом запроса.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1
    Version:
      type: integer
      format: int64
      minimum: 1
    Quantity:
      type: integer
      minimum: 1
      maximum: 999
    MoneyMinor:
      type: integer
      format: int64
      description: Сумма в копейках, только RUB.
    MoneyText:
      type: string
      description: Готовая строка для показа, например «873 010 ₽».
    NextCursor:
      type: [string, "null"]
      description: "`null` — страниц больше нет."
    Period:
      type: string
      enum: [day, week, month, year]
      default: day

    Change:
      type: object
      description: Изменение за период. Весь объект `null`, если более ранней цены нет.
      required: [direction, change_minor, change_text, percent_text]
      properties:
        direction:
          type: string
          x-known-values: [down, up, flat]
        change_minor:
          type: integer
          format: int64
          description: Со знаком; отрицательное — подешевело.
        change_text:
          type: string
          description: Например «−652 ₽».
        percent_text:
          type: string
          description: Например «0,1%».

    PriceStatus:
      type: string
      description: Почему цена такая, какая есть.
      x-known-values:
        - ok
        - check_failed
        - stale
        - out_of_stock
        - awaiting_check
        - store_disabled

    Store:
      type: object
      required: [id, name, color_token]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        color_token:
          type: string
          description: Номер цвета из палитры магазинов, например «store-3».

    Me:
      type: object
      required: [id, login, display_name, role]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        login:
          type: string
        display_name:
          type: string
        role:
          type: string
          x-known-values: [user, admin]

    TokenPair:
      type: object
      required: [token_type, access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        token_type:
          const: Bearer
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time

    Dashboard:
      type: object
      required:
        [as_of, period, total_minor, total_text, change, in_total_count, watching_count,
         categories, categories_order_version, panels, run, reviews_pending]
      properties:
        as_of:
          type: string
          format: date
        period:
          $ref: "#/components/schemas/Period"
        total_minor:
          $ref: "#/components/schemas/MoneyMinor"
        total_text:
          $ref: "#/components/schemas/MoneyText"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"
        in_total_count:
          type: integer
          minimum: 0
        watching_count:
          type: integer
          minimum: 0
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCard"
        categories_order_version:
          $ref: "#/components/schemas/Version"
        panels:
          type: object
          required: [tracked, cheaper, pricier, out_of_stock]
          properties:
            tracked:
              type: integer
              minimum: 0
            cheaper:
              type: integer
              minimum: 0
            pricier:
              type: integer
              minimum: 0
            out_of_stock:
              type: integer
              minimum: 0
        run:
          $ref: "#/components/schemas/RunStatus"
        reviews_pending:
          type: [integer, "null"]
          minimum: 0
          description: Число изменений, ждущих решения; `null` для обычного пользователя.

    CategoryCard:
      type: object
      required: [id, name, version, in_total_count, watching_count, total_minor, total_text, change, sparkline, top_mover]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        version:
          $ref: "#/components/schemas/Version"
        in_total_count:
          type: integer
          minimum: 0
        watching_count:
          type: integer
          minimum: 0
        total_minor:
          $ref: "#/components/schemas/MoneyMinor"
        total_text:
          $ref: "#/components/schemas/MoneyText"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"
        sparkline:
          type: array
          description: Пустой массив — истории ещё нет.
          items:
            $ref: "#/components/schemas/ChartPoint"
        top_mover:
          oneOf:
            - type: object
              required: [item_id, name, percent_text, direction]
              properties:
                item_id:
                  $ref: "#/components/schemas/Id"
                name:
                  type: string
                percent_text:
                  type: string
                direction:
                  type: string
                  x-known-values: [down, up, flat]
            - type: "null"

    CategoryDetail:
      type: object
      required: [id, name, version, period, total_minor, total_text, change, groups]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        version:
          $ref: "#/components/schemas/Version"
        period:
          $ref: "#/components/schemas/Period"
        total_minor:
          $ref: "#/components/schemas/MoneyMinor"
        total_text:
          $ref: "#/components/schemas/MoneyText"
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"
        groups:
          type: array
          description: Товары без группы — в элементе с `id` равным `null`.
          items:
            type: object
            required: [id, name, version, items]
            properties:
              id:
                oneOf:
                  - $ref: "#/components/schemas/Id"
                  - type: "null"
              name:
                type: [string, "null"]
              version:
                oneOf:
                  - $ref: "#/components/schemas/Version"
                  - type: "null"
              items:
                type: array
                items:
                  $ref: "#/components/schemas/ItemRow"

    ItemRow:
      type: object
      required:
        [id, version, name, quantity, in_total, price_status, under_review, best_store,
         unit_price_minor, unit_price_text, line_price_minor, line_price_text,
         regular_price_text, change, checked_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        version:
          $ref: "#/components/schemas/Version"
        name:
          type: string
        quantity:
          $ref: "#/components/schemas/Quantity"
        in_total:
          type: boolean
        price_status:
          $ref: "#/components/schemas/PriceStatus"
        under_review:
          type: boolean
          description: Изменение ждёт решения; показана последняя подтверждённая цена.
        best_store:
          oneOf:
            - $ref: "#/components/schemas/Store"
            - type: "null"
        unit_price_minor:
          oneOf:
            - $ref: "#/components/schemas/MoneyMinor"
            - type: "null"
        unit_price_text:
          type: [string, "null"]
          description: Цена по карте, если есть, иначе обычная. `null` — цены нет.
        line_price_minor:
          oneOf:
            - $ref: "#/components/schemas/MoneyMinor"
            - type: "null"
        line_price_text:
          type: [string, "null"]
          description: Цена за штуку × количество.
        regular_price_text:
          type: [string, "null"]
          description: Цена без карты, когда основная — по карте.
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"
        checked_at:
          type: [string, "null"]
          format: date-time

    ItemDetail:
      type: object
      required:
        [id, version, name, full_name, category, group, quantity, in_total, photo_url,
         price_status, under_review, best_store, unit_price_minor, unit_price_text,
         regular_price_text, failure_reason, offers, history]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        version:
          $ref: "#/components/schemas/Version"
        name:
          type: string
        full_name:
          type: [string, "null"]
        category:
          type: object
          required: [id, name]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
        group:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  $ref: "#/components/schemas/Id"
                name:
                  type: string
            - type: "null"
        quantity:
          $ref: "#/components/schemas/Quantity"
        in_total:
          type: boolean
        photo_url:
          type: [string, "null"]
          description: Путь на своём домене; ссылки на CDN магазинов не отдаются.
        price_status:
          $ref: "#/components/schemas/PriceStatus"
        under_review:
          type: boolean
        best_store:
          oneOf:
            - $ref: "#/components/schemas/Store"
            - type: "null"
        unit_price_minor:
          oneOf:
            - $ref: "#/components/schemas/MoneyMinor"
            - type: "null"
        unit_price_text:
          type: [string, "null"]
        regular_price_text:
          type: [string, "null"]
        failure_reason:
          type: [string, "null"]
          description: Понятная причина последнего сбоя проверки, если цена показана после сбоя.
        offers:
          type: array
          items:
            $ref: "#/components/schemas/StoreOffer"
        history:
          type: array
          description: Последние события, сначала новые.
          items:
            $ref: "#/components/schemas/HistoryEvent"

    StoreOffer:
      type: object
      required:
        [store, url, price_status, availability, price_minor, price_text, card_price_minor,
         card_price_text, checked_at, is_best]
      properties:
        store:
          $ref: "#/components/schemas/Store"
        url:
          type: string
          format: uri
          description: Ссылка «Открыть в магазине».
        price_status:
          $ref: "#/components/schemas/PriceStatus"
        availability:
          type: string
          x-known-values: [in_stock, out_of_stock, unknown]
        price_minor:
          oneOf:
            - $ref: "#/components/schemas/MoneyMinor"
            - type: "null"
        price_text:
          type: [string, "null"]
        card_price_minor:
          oneOf:
            - $ref: "#/components/schemas/MoneyMinor"
            - type: "null"
        card_price_text:
          type: [string, "null"]
        checked_at:
          type: [string, "null"]
          format: date-time
        is_best:
          type: boolean

    HistoryEvent:
      type: object
      required: [at, store, kind, text]
      properties:
        at:
          type: string
          format: date-time
        store:
          $ref: "#/components/schemas/Store"
        kind:
          type: string
          x-known-values: [price_changed, out_of_stock, back_in_stock, check_failed, decision]
        text:
          type: string
          description: Готовое описание, например «12 990 ₽ → 11 490 ₽».

    ItemChange:
      type: object
      required: [item_id, name, store, category, old_price_text, new_price_text, change]
      properties:
        item_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        store:
          oneOf:
            - $ref: "#/components/schemas/Store"
            - type: "null"
        category:
          type: object
          required: [id, name]
          properties:
            id:
              $ref: "#/components/schemas/Id"
            name:
              type: string
        old_price_text:
          type: [string, "null"]
        new_price_text:
          type: [string, "null"]
        change:
          oneOf:
            - $ref: "#/components/schemas/Change"
            - type: "null"

    ChartPoint:
      type: object
      required: [date, value_minor, label, status]
      properties:
        date:
          type: string
          format: date
        value_minor:
          oneOf:
            - $ref: "#/components/schemas/MoneyMinor"
            - type: "null"
        label:
          type: string
          description: Готовая подпись для перекрестия, например «5 окт · 873 010 ₽».
        status:
          type: string
          x-known-values: [ok, no_data, stale]

    ReorderRequest:
      type: object
      additionalProperties: false
      required: [ids, version]
      properties:
        ids:
          type: array
          description: Полный упорядоченный список.
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Id"
        version:
          $ref: "#/components/schemas/Version"

    OrderState:
      type: object
      required: [ids, version]
      properties:
        ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        version:
          $ref: "#/components/schemas/Version"

    RunStatus:
      type: object
      required: [id, kind, status, total, done, failed, started_at, finished_at, can_start, can_stop]
      properties:
        id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
          description: "`null` — проверок ещё не было."
        kind:
          type: [string, "null"]
          x-known-values: [scheduled, manual]
        status:
          type: string
          x-known-values: [idle, queued, running, stopping, finished, failed, worker_offline]
        total:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        can_start:
          type: boolean
          description: Кнопку запуска показывать только при `true`; у обычного пользователя всегда `false`.
        can_stop:
          type: boolean

    Review:
      type: object
      required: [id, kind, item_id, item_name, store, url, checked_at, before_text, after_text, decision]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          x-known-values: [title_changed, price_jump]
        item_id:
          $ref: "#/components/schemas/Id"
        item_name:
          type: string
        store:
          $ref: "#/components/schemas/Store"
        url:
          type: string
          format: uri
        checked_at:
          type: string
          format: date-time
        before_text:
          type: string
        after_text:
          type: string
        decision:
          type: [string, "null"]
          x-known-values: [accept, reject]
          description: "`null` — решения ещё нет."

    Notification:
      type: object
      required: [id, kind, text, created_at, read, repeat_count, link]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          x-known-values:
            [suspicious_change, captcha, run_failed, worker_offline, bot_offline, backup_failed,
             refresh_reuse, client_error, unexpected_error, recovered]
        text:
          type: string
        created_at:
          type: string
          format: date-time
        read:
          type: boolean
        repeat_count:
          type: integer
          minimum: 1
          description: Сколько раз повторился инцидент (склейка по dedup_key).
        link:
          type: [object, "null"]
          required: [type, id]
          properties:
            type:
              type: string
              x-known-values: [item, run, review]
            id:
              $ref: "#/components/schemas/Id"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, error_id]
          properties:
            code:
              type: string
              description: Машинный код ошибки.
              x-known-values:
                [AUTH_REQUIRED, FORBIDDEN, NOT_FOUND, VALIDATION_ERROR, RATE_LIMITED,
                 PAIRING_CODE_INVALID, PAIRING_CODE_EXPIRED, REFRESH_TOKEN_INVALID,
                 REFRESH_TOKEN_REUSED, IDEMPOTENCY_KEY_REUSED, VERSION_CONFLICT,
                 RUN_IN_PROGRESS, WORKER_OFFLINE, DB_ERROR, INTERNAL_ERROR]
            message:
              type: string
              description: Понятное сообщение для пользователя, без технических подробностей.
            error_id:
              type: [string, "null"]
              description: Идентификатор инцидента для поддержки.
            retry_after_seconds:
              type: [integer, "null"]
              minimum: 0
            details:
              type: object
              description: |
                `VERSION_CONFLICT` — `current` с актуальным состоянием записи;
                `RUN_IN_PROGRESS` — `run` с прогрессом; `VALIDATION_ERROR` — `fields` с ошибками полей.
