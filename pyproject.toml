[project]
name = "pricewatch"
version = "0.1.0"
description = "Price Watcher: отслеживание цен в магазинах Санкт-Петербурга"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
