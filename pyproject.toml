[project]
name = "pricewatch"
version = "0.1.0"
description = "Price Watcher: отслеживание цен в магазинах Санкт-Петербурга"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "grimp>=3.17",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
]

# Границы модулей: DEVELOPMENT_ARCHITECTURE.md, раздел 3.
# Контракты меняются только с согласия владельца (AGENTS.md, раздел 2).
[tool.importlinter]
root_package = "pricewatch"
# Стандартная библиотека и сторонние пакеты попадают в граф: нужно контракту stdlib_only.
include_external_packages = true
contract_types = ["stdlib_only: tools.import_contracts.StdlibOnlyContract"]

[[tool.importlinter.contracts]]
id = "domain-stdlib-only"
name = "domain импортирует только стандартную библиотеку"
type = "stdlib_only"
source_modules = ["pricewatch.domain"]

[[tool.importlinter.contracts]]
id = "application-depends-on-domain-only"
name = "application зависит только от domain"
type = "forbidden"
source_modules = ["pricewatch.application"]
forbidden_modules = [
    "pricewatch.persistence",
    "pricewatch.api",
    "pricewatch.web",
    "pricewatch.parsers",
    "pricewatch.worker",
    "pricewatch.scheduler",
    "pricewatch.bot",
    "pricewatch.observability",
    "pricewatch.bootstrap",
    "pricewatch.config",
]

[[tool.importlinter.contracts]]
id = "persistence-implements-application"
name = "persistence не импортирует api, web, parsers, worker, scheduler, bot, bootstrap"
type = "forbidden"
source_modules = ["pricewatch.persistence"]
forbidden_modules = [
    "pricewatch.api",
    "pricewatch.web",
    "pricewatch.parsers",
    "pricewatch.worker",
    "pricewatch.scheduler",
    "pricewatch.bot",
    "pricewatch.bootstrap",
]

[[tool.importlinter.contracts]]
id = "persistence-only-from-bootstrap"
name = "persistence импортирует только bootstrap"
type = "protected"
protected_modules = ["pricewatch.persistence"]
allowed_importers = ["pricewatch.bootstrap"]

[[tool.importlinter.contracts]]
id = "bootstrap-is-entry-point"
name = "bootstrap никто не импортирует: обход сценариев через него невозможен"
type = "protected"
protected_modules = ["pricewatch.bootstrap"]
allowed_importers = []

[[tool.importlinter.contracts]]
id = "worker-bot-without-persistence"
name = "worker и bot не импортируют persistence"
type = "forbidden"
source_modules = ["pricewatch.worker", "pricewatch.bot"]
forbidden_modules = ["pricewatch.persistence"]
