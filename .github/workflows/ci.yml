# Проверки на каждый push и pull request: тесты, границы модулей, карта проекта, секреты;
# тот же набор на Windows — проект обязан запускаться не только на Raspberry Pi.
# Сторонние действия закреплены по хешу коммита; gitleaks скачивается с проверкой контрольной суммы.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Тесты, границы модулей, карта
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: ci-only-not-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Пароль одноразового контейнера CI; доступен только внутри прогона.
      TEST_DATABASE_URL: postgresql://postgres:ci-only-not-secret@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: Окружение по uv.lock
        run: uv sync --locked

      - name: Тесты
        # Браузерные тесты запускают Google Chrome с окном: на сервере без монитора — виртуальный экран.
        run: xvfb-run -a uv run pytest

      - name: Границы модулей
        run: uv run lint-imports

      - name: Карта проекта
        run: uv run python tools/check_project_map.py

  windows:
    name: Тесты на Windows
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      # На образе Windows только PostgreSQL 17, а тесты требуют 18: сборка EDB, сумма сверена
      # с манифестом Scoop (ScoopInstaller/Main, bucket/postgresql.json).
      PG_VERSION: "18.6-5"
      PG_SHA256: "e2246ba91d22345bc3d017586c09ede52d9df180b1eeb480f050445f1cad84e2"
      # Пароль одноразовой базы CI; доступен только внутри прогона.
      TEST_DATABASE_URL: postgresql://postgres:ci-only-not-secret@localhost:5432/postgres
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"

      - name: PostgreSQL 18
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "postgresql-$env:PG_VERSION-windows-x64-binaries.zip"
          curl.exe -fsSL -o $archive "https://get.enterprisedb.com/postgresql/postgresql-$env:PG_VERSION-windows-x64-binaries.zip"
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:PG_SHA256) { throw "Контрольная сумма PostgreSQL не совпала: $actual" }
          tar.exe -xf $archive -C $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP "pgsql\bin"
          $data = Join-Path $env:RUNNER_TEMP "pgdata"
          $passwordFile = Join-Path $env:RUNNER_TEMP "pgpass"
          Set-Content -Path $passwordFile -Value "ci-only-not-secret" -NoNewline
          # Пароль проверяется, как в CI на Linux и на узле: доверительный вход скрыл бы ошибки паролей.
          & "$bin\initdb.exe" -D $data -U postgres --pwfile=$passwordFile --auth=scram-sha-256 --encoding=UTF8 --locale=C --locale-provider=builtin --builtin-locale=C.UTF-8
          if ($LASTEXITCODE -ne 0) { throw "initdb завершился с кодом $LASTEXITCODE" }
          & "$bin\pg_ctl.exe" -D $data -l (Join-Path $env:RUNNER_TEMP "postgresql.log") -o "-p 5432" -w start
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:RUNNER_TEMP "postgresql.log"); throw "PostgreSQL не запустился" }

      - name: Окружение по uv.lock
        run: uv sync --locked

      - name: Тесты
        run: uv run pytest

      - name: Границы модулей
        # import-linter — сторонняя программа и печатает русские имена контрактов в кодировке
        # системы; в канал CI на Windows это cp1252, и вывод падает. Свой код от этого не зависит.
        env:
          PYTHONIOENCODING: utf-8
        run: uv run lint-imports

      - name: Карта проекта
        run: uv run python tools/check_project_map.py

      # Worker на домашнем ПК — программа Windows (deploy/windows); скрипты — в Windows PowerShell 5.1, как у владельца.
      - name: Скрипты worker для Windows разбираются
        shell: powershell
        run: |
          foreach ($script in Get-ChildItem deploy\windows\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; throw "$($script.Name) не разбирается" }
          }

      # Последним шагом: install-worker.ps1 ставит окружение без инструментов разработки.
      - name: Установка worker и состояние автозапуска
        shell: powershell
        run: |
          Set-Content -Encoding ascii worker.env "PRICEWATCH_WORKER_API_URL=http://127.0.0.1:8000`nPRICEWATCH_WORKER_TOKEN=$('t' * 48)"
          powershell -ExecutionPolicy Bypass -File deploy\windows\install-worker.ps1
          if ($LASTEXITCODE -ne 0) { throw "install-worker.ps1 завершился с кодом $LASTEXITCODE" }
          Set-Content -Encoding ascii worker.env "PRICEWATCH_WORKER_API_URL=http://127.0.0.1:8000"
          powershell -ExecutionPolicy Bypass -File deploy\windows\install-worker.ps1
          if ($LASTEXITCODE -ne 1) { throw "без токена install-worker.ps1 должен отказать, а вернул $LASTEXITCODE" }
          powershell -ExecutionPolicy Bypass -File deploy\windows\autostart.ps1 -Status
          if ($LASTEXITCODE -ne 0) { throw "autostart.ps1 -Status завершился с кодом $LASTEXITCODE" }

  docker:
    name: Образы и запуск в Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Сборка, запуск домашнего узла, проверка здоровья и резервной копии
        working-directory: deploy/home
        env:
          POSTGRES_PASSWORD: cionlynotsecretdocker
        run: |
          printf 'PRICEWATCH_ENV=development\nPRICEWATCH_PUBLIC_ORIGIN=http://127.0.0.1:8000\nPRICEWATCH_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" > "$RUNNER_TEMP/server.env"
          # Ключ age для копий появится после сборки образа; до неё Compose нужен файл настроек копий.
          touch "$RUNNER_TEMP/backup.env"
          mkdir -m 777 "$RUNNER_TEMP/backups"
          # Папка ключа SSH службы копий: до первого запуска службы, иначе Docker создаст её сам от root.
          mkdir -m 777 backup-ssh
          export PRICEWATCH_SERVER_ENV="$RUNNER_TEMP/server.env"
          export PRICEWATCH_BACKUP_ENV="$RUNNER_TEMP/backup.env" BACKUP_HOST_DIR="$RUNNER_TEMP/backups"
          docker compose config -q
          docker compose build
          # Конфигурации туннеля: Caddy дома и HAProxy на арендном сервере (теми же образами, что в работе).
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" "$(docker compose config --images | grep '^caddy')" caddy validate --config /etc/caddy/Caddyfile
          # bot.env арендного сервера в CI нет; для разбора Compose хватит пустого.
          touch ../vps/bot.env
          docker run --rm -v "$PWD/../vps/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" "$(docker compose -f ../vps/compose.yaml config --images | grep '^haproxy')" haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          docker compose up -d --wait db app scheduler
          curl -fsS http://127.0.0.1:8000/healthz
          # Резервная копия тем же образом и с теми же ограничениями: копия → отправка на сервер копий → расшифровка
          # тестовым ключом → pg_restore. Сервер копий — как арендный: тот же deploy/vps/backup-target.sh в чистой Ubuntu 26.04
          # (rrsync -no-overwrite есть с rsync 3.4; в Debian bookworm его нет).
          docker compose run --rm --no-deps --entrypoint age-keygen backup > "$RUNNER_TEMP/age.key"
          docker compose run --rm --no-deps -v "$PWD/backup-ssh:/out" --entrypoint ssh-keygen backup -q -t ed25519 -N '' -C pricewatch-backup -f /out/id_ed25519
          docker run -d --name backup-target --network pricewatch_backend -v "$PWD/../vps/backup-target.sh:/backup-target.sh:ro" \
            ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7 sleep infinity
          docker exec backup-target sh -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server rsync python3 > /dev/null'
          docker exec backup-target sh /backup-target.sh "$(cat backup-ssh/id_ed25519.pub)"
          docker exec backup-target sh -c 'mkdir -p /run/sshd && /usr/sbin/sshd'
          printf 'backup-target %s\n' "$(docker exec backup-target cut -d' ' -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)" > backup-ssh/known_hosts
          printf 'PRICEWATCH_BACKUP_RECIPIENT=%s\nPRICEWATCH_BACKUP_REMOTE=pwbackup@backup-target\n' "$(grep -o 'age1[0-9a-z]*' "$RUNNER_TEMP/age.key")" > "$RUNNER_TEMP/backup.env"
          docker compose run --rm --no-deps backup python -m pricewatch.bootstrap backup --once
          ls -l "$RUNNER_TEMP/backups"
          name="$(basename "$RUNNER_TEMP"/backups/pricewatch-*.tar.age)"
          test "$(docker exec backup-target sha256sum "/srv/pricewatch-backups/$name" | cut -d' ' -f1)" = "$(sha256sum "$RUNNER_TEMP/backups/$name" | cut -d' ' -f1)"
          # Ключ службы копий может только дописывать: не читает, не выполняет команд, не удаляет и не перезаписывает.
          cat > "$RUNNER_TEMP/deny.sh" <<'SH'
          cp /run/backup-ssh/id_ed25519 /tmp/k && chmod 600 /tmp/k
          SSH="ssh -F /dev/null -i /tmp/k -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/run/backup-ssh/known_hosts"
          denied() { echo "ключ службы копий смог: $1" >&2; exit 1; }
          rsync -e "$SSH" "pwbackup@backup-target:$1" /tmp/stolen && denied "прочитать копию"
          $SSH pwbackup@backup-target ls / && denied "выполнить команду"
          mkdir /tmp/empty && rsync -r --delete -e "$SSH" /tmp/empty/ pwbackup@backup-target: && denied "удалить копии"
          printf junk > "/tmp/$1" && rsync -e "$SSH" "/tmp/$1" pwbackup@backup-target: || denied "отправить файл (должно молча пропустить)"
          exit 0
          SH
          docker compose run --rm --no-deps -v "$RUNNER_TEMP/deny.sh:/deny.sh:ro" --entrypoint sh backup /deny.sh "$name"
          test "$(docker exec backup-target sha256sum "/srv/pricewatch-backups/$name" | cut -d' ' -f1)" = "$(sha256sum "$RUNNER_TEMP/backups/$name" | cut -d' ' -f1)"
          docker rm -f backup-target
          docker compose run --rm --no-deps -v "$RUNNER_TEMP/age.key:/run/age.key:ro" --entrypoint sh backup -c \
            'age --decrypt --identity /run/age.key /backups/pricewatch-*.tar.age | tar -xO database.dump | pg_restore --list | grep -q "TABLE public backup_runs"'
          test "$(docker compose exec -T db psql -U pricewatch -d pricewatch -tAc "SELECT status FROM backup_runs")" = ok
          docker compose down -v

      - name: Запуск HAProxy арендного сервера
        working-directory: deploy/vps
        run: |
          touch bot.env
          # Здоров — значит, открыл порты 80 и 443 от своего пользователя без прав root.
          docker compose up -d --wait --wait-timeout 60 haproxy
          docker compose down

  secrets:
    name: Секреты во всей истории (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Установить gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Проверить историю
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
